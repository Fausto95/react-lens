<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Lens — React debugging with receipts</title>
    <meta
      name="description"
      content="Time travel through real state. Trace any value to its source. Simulate the fix before you make it. Bisect the commit that broke perf. Human or AI agent — every answer cites the exact render, component, and line. This site is inspecting itself."
    />
    <link rel="canonical" href="https://www.reactlens.xyz/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Absolute OG URLs must match the live origin (WhatsApp/LinkedIn fetch
         og:image directly — a dead domain or redirect breaks the preview). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="React Lens" />
    <meta property="og:title" content="React Lens — React debugging with receipts" />
    <meta
      property="og:description"
      content="Time travel through real state. Trace any value to its source. Simulate the fix before you make it. Bisect the commit that broke perf. Human or AI agent — every answer cites the exact render, component, and line."
    />
    <meta property="og:url" content="https://www.reactlens.xyz/" />
    <meta property="og:image" content="https://www.reactlens.xyz/og.png" />
    <meta property="og:image:secure_url" content="https://www.reactlens.xyz/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="React Lens — React debugging with receipts. Time travel, AI agent, render causes, AST Doctor, waste detection, Suspense &amp; RSC."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="React Lens — React debugging with receipts" />
    <meta
      name="twitter:description"
      content="Time travel through real state. Trace any value to its source. Simulate the fix before you make it. Bisect the commit that broke perf. Human or AI agent — every answer cites the exact render, component, and line."
    />
    <meta name="twitter:image" content="https://www.reactlens.xyz/og.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #0b0d10;
      }
      html[data-rl-theme="light"],
      html[data-rl-theme="light"] body {
        color-scheme: light;
        background: #ffffff;
      }
    </style>
    <script>
      /* Stamp theme before paint to avoid a dark→light flash.
         Also seed panel prefs so the docked Lens chrome matches. */
      (function () {
        try {
          var pref = localStorage.getItem("react-lens/site-theme") || "system";
          var light =
            pref === "light" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.rlTheme = light ? "light" : "dark";
          try {
            var raw = localStorage.getItem("react-lens/panel-prefs");
            var parsed = raw ? JSON.parse(raw) : {};
            parsed.theme = pref;
            localStorage.setItem("react-lens/panel-prefs", JSON.stringify(parsed));
          } catch (e2) {}
        } catch (e) {
          document.documentElement.dataset.rlTheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
