<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta

      content="Time-travel through React state, inspect interactions on a professional timeline, and trace render cascades from trigger to component. React debugging for humans and AI agents, grounded in evidence."
    />
    <link rel="canonical" href="https://www.reactlens.xyz/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="React Lens" />
    <meta property="og:title" content="React Lens — See every render. Follow every cause." />
    <meta
      property="og:description"
      content="Time travel, a professional interaction timeline, causal render cascades, AI diagnostics, session diffs, and CI — all grounded in React trace evidence."
    />
    <meta property="og:url" content="https://www.reactlens.xyz/" />
    <meta property="og:image" content="https://www.reactlens.xyz/og.png" />
    <meta property="og:image:secure_url" content="https://www.reactlens.xyz/og.png" />

      property="og:image:alt"
      content="React Lens showing a render cascade and interaction timeline alongside the headline See every render. Follow every cause."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="React Lens — See every render. Follow every cause." />
    <meta
      name="twitter:description"
      content="Time travel, causal render cascades, an editing-style timeline, AI diagnostics, and CI — grounded in React trace evidence."
    />
    <meta name="twitter:image" content="https://www.reactlens.xyz/og.png" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b0d10; }
      html[data-rl-theme="light"], html[data-rl-theme="light"] body { color-scheme: light; background: #ffffff; }
    </style>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("react-lens/site-theme") || "system";
          var light = pref === "light" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.rlTheme = light ? "light" : "dark";
          try {
            var raw = localStorage.getItem("react-lens/panel-prefs");
            var parsed = raw ? JSON.parse(raw) : {};
            parsed.theme = pref;
            localStorage.setItem("react-lens/panel-prefs", JSON.stringify(parsed));
          } catch (e2) {}
        } catch (e) {
          document.documentElement.dataset.rlTheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
