name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "20"
          cache: true

      - run: vp install

      - name: Remove timeline hot-path regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/devtools/src/timeline/view/Timeline.tsx')
          s = p.read_text()
          s = s.replace(
            '  const [hoverId, setHoverId] = useState<string | null>(null);',
            '  const hoverRef = useRef<string | null>(null);',
          )
          s = s.replace(
            '  const theme = readTimelineTheme(rootRef.current?.closest(".rl-redesign") ?? null);',
            '  const themeRef = useRef(readTimelineTheme(null));\n  themeRef.current = readTimelineTheme(rootRef.current?.closest(".rl-redesign") ?? null);',
          )

          needle = '''  const installGeometry = useCallback((rects: Map<string, ClipRect>, edges: number[]) => {\n    clipRectsRef.current = rects;\n    hitBandsRef.current = indexByBand(rects);\n    snapEdgesRef.current = edges;\n  }, []);\n\n  const paint = useCallback(() => {'''
          replacement = '''  const installGeometry = useCallback((rects: Map<string, ClipRect>, edges: number[]) => {\n    clipRectsRef.current = rects;\n    hitBandsRef.current = indexByBand(rects);\n    snapEdgesRef.current = edges;\n  }, []);\n\n  const paintOverlay = useCallback(\n    (rects: Map<string, ClipRect> = clipRectsRef.current) => {\n      const overlay = overlayRef.current;\n      const ctx = overlay?.getContext("2d");\n      if (!ctx) return;\n      drawOverlay({\n        ctx,\n        stageW: size.width,\n        totalH: paintH,\n        nameW,\n        clipRects: rects,\n        edges: arrows,\n        selectedRender: state.selectedRender,\n        marquee: null,\n        hoverId: hoverRef.current,\n        ghostT: null,\n        playheadT: playheadRef.current,\n        wToX,\n        dragging: dragRef.current != null,\n        theme: themeRef.current,\n        viewMode,\n      });\n    },\n    [arrows, nameW, paintH, size.width, state.selectedRender, viewMode, wToX],\n  );\n\n  const paint = useCallback(() => {'''
          if needle not in s:
            raise SystemExit('installGeometry insertion point not found')
          s = s.replace(needle, replacement)

          s = s.replace(
            '''    const base = baseRef.current;\n    const overlay = overlayRef.current;\n    if (!base || !overlay) return;\n    const octx = overlay.getContext("2d");\n    if (!octx) return;''',
            '''    const base = baseRef.current;\n    if (!base) return;\n    const theme = themeRef.current;''',
          )

          old_callback = '''        (rects, edges) => {\n          installGeometry(rects, edges);\n          const nextOverlay = overlayRef.current?.getContext("2d");\n          if (!nextOverlay) return;\n          drawOverlay({\n            ctx: nextOverlay,\n            stageW: size.width,\n            totalH: paintH,\n            nameW,\n            clipRects: rects,\n            edges: arrows,\n            selectedRender: state.selectedRender,\n            marquee: null,\n            hoverId,\n            ghostT: null,\n            playheadT: playheadRef.current,\n            wToX,\n            dragging: dragRef.current != null,\n            theme,\n            viewMode,\n          });\n        },'''
          new_callback = '''        (rects, edges) => {\n          installGeometry(rects, edges);\n          paintOverlay(rects);\n        },'''
          if old_callback not in s:
            raise SystemExit('worker overlay callback not found')
          s = s.replace(old_callback, new_callback)

          old_overlay = '''\n    drawOverlay({\n      ctx: octx,\n      stageW: size.width,\n      totalH: paintH,\n      nameW,\n      clipRects: clipRectsRef.current,\n      edges: arrows,\n      selectedRender: state.selectedRender,\n      marquee: null,\n      hoverId,\n      ghostT: null,\n      playheadT: playheadRef.current,\n      wToX,\n      dragging: dragRef.current != null,\n      theme,\n      viewMode,\n    });'''
          if old_overlay not in s:
            raise SystemExit('final overlay block not found')
          s = s.replace(old_overlay, '\n    paintOverlay();')

          old_deps = '''  }, [\n    aToX,\n    arrows,\n    axis,\n    bounds.t0,\n    hoverId,\n    installGeometry,\n    layout,\n    markers,\n    model.timelineResult,\n    nameW,\n    paintH,\n    pxPerMs,\n    size.width,\n    state.region,\n    state.selectedRender,\n    state.view,\n    theme,\n    viewMode,\n    wToX,\n  ]);'''
          new_deps = '''  }, [\n    aToX,\n    axis,\n    bounds.t0,\n    installGeometry,\n    layout,\n    markers,\n    model.timelineResult,\n    nameW,\n    paintOverlay,\n    pxPerMs,\n    size.width,\n    state.region,\n    state.selectedRender,\n    state.view,\n    viewMode,\n    wToX,\n  ]);'''
          if old_deps not in s:
            raise SystemExit('paint dependency block not found')
          s = s.replace(old_deps, new_deps)

          old_hover = '''    const hit = hitAt(x, y);\n    const nextId = hit ? String(hit.clip.renderId) : null;\n    if (nextId !== hoverId) setHoverId(nextId);\n    onHighlight?.(hit?.clip.componentId ?? null);\n    setTip(hit ? { clip: hit.clip, x: Math.min(size.width - 220, x + 14), y: y + 14 } : null);'''
          new_hover = '''    const hit = hitAt(x, y);\n    const nextId = hit ? String(hit.clip.renderId) : null;\n    if (nextId !== hoverRef.current) {\n      hoverRef.current = nextId;\n      onHighlight?.(hit?.clip.componentId ?? null);\n      setTip(hit ? { clip: hit.clip, x: Math.min(size.width - 220, x + 14), y: y + 14 } : null);\n      paintOverlay();\n    }'''
          if old_hover not in s:
            raise SystemExit('hover block not found')
          s = s.replace(old_hover, new_hover)

          s = s.replace(
            '''        onPointerLeave={() => {\n          setHoverId(null);\n          setTip(null);\n          onHighlight?.(null);\n        }}''',
            '''        onPointerLeave={() => {\n          hoverRef.current = null;\n          setTip(null);\n          onHighlight?.(null);\n          paintOverlay();\n        }}''',
          )
          p.write_text(s)

          p = Path('apps/devtools/src/timeline/view/draw.ts')
          s = p.read_text()
          needle = '''  const { clipRects, snapEdges } =\n    geometry && geoRanges\n      ? clipRectsFromGeometry(layout, geometry, geoRanges, proj, detailed)\n      : computeClipRects(layout, proj);\n\n  for (const row of layout.rows) {'''
          replacement = '''  const { clipRects, snapEdges } =\n    geometry && geoRanges\n      ? clipRectsFromGeometry(layout, geometry, geoRanges, proj, detailed)\n      : computeClipRects(layout, proj);\n  const rectsByLane = new Map<string, ClipRect[]>();\n  for (const rect of clipRects.values()) {\n    const key = String(rect.clip.laneKey);\n    const laneRects = rectsByLane.get(key);\n    if (laneRects) laneRects.push(rect);\n    else rectsByLane.set(key, [rect]);\n  }\n\n  for (const row of layout.rows) {'''
          if needle not in s:
            raise SystemExit('clip rect grouping insertion point not found')
          s = s.replace(needle, replacement)
          s = s.replace(
            '''    for (const rect of clipRects.values()) {\n      if (rect.clip.laneKey !== row.key) continue;''',
            '''    for (const rect of rectsByLane.get(String(row.key)) ?? []) {''',
          )
          p.write_text(s)
          PY

          vp check --fix
          vp check

      - name: Commit hot-path fixes
        run: |
          git fetch origin more-perf --depth=1
          git show origin/more-perf:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "react-lens-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "perf(timeline): keep hover and lane painting viewport-local"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - run: vp run check:compiled
      - run: vp run check:compiled:build
      - run: vp test run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "20"
          cache: true

      - run: vp install

      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run e2e
        run: vp run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
