name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "20"
          cache: true

      - run: vp install

      - name: Fix timeline lint issues and format
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/devtools/src/timeline/view/Timeline.tsx')
          s = p.read_text()
          s = s.replace('import { useCallback, useEffect, useMemo, useRef, useState } from "react";', 'import { useCallback, useEffect, useRef, useState } from "react";')
          s = s.replace('''  const theme = useMemo(\n    () => readTimelineTheme(rootRef.current?.closest(".rl-redesign") ?? null),\n    [size.width, viewMode],\n  );''', '''  const theme = readTimelineTheme(rootRef.current?.closest(".rl-redesign") ?? null);''')
          p.write_text(s)

          p = Path('apps/devtools/src/timeline/view/draw.ts')
          s = p.read_text()
          s = s.replace('bins[bi] += Math.max(1, clip.renderCount ?? 1);', 'bins[bi] = (bins[bi] ?? 0) + Math.max(1, clip.renderCount ?? 1);')
          s = s.replace('if (!text || semantic === "interactions") continue;', 'if (!text) continue;')
          p.write_text(s)

          p = Path('apps/devtools/src/useTreeWindow.ts')
          s = p.read_text()
          s = s.replace('''  return useMemo(() => {\n    const include =''', '''  return useMemo(() => {\n    void args.version;\n    const include =''')
          p.write_text(s)
          PY

          vp check --fix
          vp check

      - name: Commit canonical formatting
        run: |
          git fetch origin more-perf --depth=1
          git show origin/more-perf:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "react-lens-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(timeline): apply canonical formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - run: vp run check:compiled
      - run: vp run check:compiled:build
      - run: vp test run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "20"
          cache: true

      - run: vp install

      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run e2e
        run: vp run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
