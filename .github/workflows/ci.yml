name: CI

# Unit (Vitest) + Playwright e2e against apps/e2e-fixture. Runs on every PR and
# on pushes to main so release workflows can assume the suite is green.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "20"
          cache: true

      - run: vp install

      - run: vp check

      # Every file must stay compiled: one `"use no memo"` silently drops a
      # whole file, and the panel's files are the expensive ones.
      - run: pnpm check:compiled

      # Bundle must carry Compiler output (memo_cache_sentinel), not just
      # pass the directive ban — a misconfigured sources filter would otherwise
      # ship unoptimized panel code silently. Runs on every PR + main push.
      - run: pnpm check:compiled:build

      - run: vp test run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "20"
          cache: true

      - run: vp install

      # Chromium only — matches the default Playwright project and keeps the
      # download small. --with-deps installs the OS libraries Ubuntu needs.
      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run e2e
        run: vp run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
